name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: Build the plugin bundle
        run: npx esbuild kilo/plugin.ts --bundle --format=esm --platform=node --outfile=.test/plugin.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Shim harness (real bundle, real vendored hooks)
        run: node --test test/harness.mjs
      - name: Rule corpus checker regression tests
        run: python3 test/rule_corpus_check.py
